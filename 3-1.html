<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>213 张钧乔</title>
</head>
<from>
    <h2>HTML表单</h2>
    <form action="https://huanqiu.com" method="get">
        <p>
            用户名：<input type="text" name="username">
        </p>
        <p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别：<input type="radio" name="sex" value="male"> 男
            <input type="radio" name="sex" value="f"> 女
            <!-- 保密 -->
             <input type="radio" name="sex" value="s"> 保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="reading"> 阅读
            <input type="checkbox" name="hobby" value="music"> 音乐
            <input type="checkbox" name="hobby" value="sports"> 运动
        </p>
        <p>
            籍贯：<select name="hometown">
                   <option value="beijing">北京</option>
                   <option value="shanghai">上海</option>
                   <option value="guangzhou">广州</option>
                   <option value="shenzhen">深圳</option>
            </select>
        </p>
        <p>
            个人简介：<textarea name="introduction" rows="4" cols="50"></textarea>
        </p>
        <p>
            出生日期：<input type="date" name="birthdate">
        </p>
        <p>
            多文件上传：<input type="file" name="files" multiple>
        </p>
        <p>
            <!-- 按钮：普通按钮、提交按钮、重置按钮 -->
            <input type="button" value="普通按钮">
            <input type="submit" value="提交">
            <input type="reset" value="重置">
        </p>
    </form>
        <!-- 按钮 -->
         <button>表单外的按钮</button>
    </from>
</body>
</html>
