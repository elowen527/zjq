<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>媒体查询改变背景颜色</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		.zhang_fullscreen-box {
			width: 100%;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #ef476f;
			color: #fff;
			font-family: "Microsoft YaHei", sans-serif;
			font-size: 2rem;
			font-weight: bold;
		}

		@media (min-width: 600px) {
			html {
				font-size: 112.5%;
			}

			.zhang_fullscreen-box {
				background-color: #06d6a0;
			}
		}

		@media (min-width: 900px) {
			html {
				font-size: 125%;
			}

			.zhang_fullscreen-box {
				background-color: #118ab2;
			}
		}
	</style>
</head>
<body>
	<div class="zhang_fullscreen-box">213张钧乔</div>
</body>
</html>
