<!DOCTYPE html>
<!-- 姓名：张钧乔，建立时间：2026-11-02 11:30:00，使用的大模型：GLM-5.3，功能名称：fetch获取Dog CEO随机猎犬图片并展示 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="通过 fetch 从 Dog CEO API 获取 3 张随机猎犬图片并展示">
    <title>随机猎犬图片 | 张钧乔</title>
    <style>
        :root {
            --zjq-ink: #182230;
            --zjq-muted: #667085;
            --zjq-white: #ffffff;
            --zjq-orange: #e9693f;
            --zjq-teal: #277b78;
            --zjq-line: #d9d5cb;
            --zjq-shadow: 0 14px 36px rgba(31, 48, 36, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--zjq-ink);
            background:
                radial-gradient(circle at 88% 4%, rgba(233, 105, 63, 0.10), transparent 24rem),
                linear-gradient(135deg, #f4f0e8 0%, #edf3ee 55%, #fffaf2 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            line-height: 1.7;
        }

        code {
            font-family: Consolas, Monaco, "Courier New", monospace;
        }

        .zjq_shell {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 44px;
        }

        .zjq_top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .zjq_back {
            color: var(--zjq-muted);
            font-size: 14px;
            text-decoration: none;
        }

        .zjq_back:hover {
            color: var(--zjq-orange);
        }

        .zjq_badge {
            color: var(--zjq-orange);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .zjq_header {
            padding: 34px 0 10px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 4.5vw, 44px);
        }

        h1 span {
            color: var(--zjq-teal);
        }

        .zjq_api {
            margin: 8px 0 0;
            color: var(--zjq-muted);
            font-size: 13px;
        }

        .zjq_btn {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            background: var(--zjq-teal);
            color: var(--zjq-white);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .zjq_btn:hover {
            background: #1d5f5c;
        }

        .zjq_btn:disabled {
            background: #a8b5b2;
            cursor: not-allowed;
        }

        .zjq_grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .zjq_card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--zjq-line);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(31, 48, 36, 0.08);
            animation: zjq_fadein 420ms ease both;
        }

        .zjq_card:nth-child(2) { animation-delay: 80ms; }
        .zjq_card:nth-child(3) { animation-delay: 160ms; }

        @keyframes zjq_fadein {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .zjq_card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #eceae4;
        }

        .zjq_card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid #eee9df;
            font-size: 12px;
            color: var(--zjq-muted);
        }

        .zjq_card-meta strong {
            color: var(--zjq-teal);
            font-size: 12.5px;
        }

        .zjq_status {
            margin-top: 20px;
            padding: 12px 16px;
            border: 1px dashed var(--zjq-line);
            border-radius: 4px;
            background: #faf8f3;
            font-size: 13.5px;
        }

        .zjq_status.zjq_status-err {
            border-color: var(--zjq-orange);
            background: #fdf0eb;
            color: var(--zjq-orange-dark);
        }

        .zjq_skeleton {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: linear-gradient(90deg, #eeeae2 25%, #f6f3ec 50%, #eeeae2 75%);
            background-size: 200% 100%;
            animation: zjq_shimmer 1.2s infinite linear;
        }

        @keyframes zjq_shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .zjq_footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--zjq-line);
            color: var(--zjq-muted);
            font-size: 13px;
        }

        .zjq_footer a {
            color: var(--zjq-teal);
            text-decoration: none;
        }

        .zjq_footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .zjq_grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="zjq_shell">
        <nav class="zjq_top">
            <a class="zjq_back" href="index.html">← 返回作品集首页</a>
            <span class="zjq_badge">17-2 / FETCH</span>
        </nav>

        <header class="zjq_header">
            <h1>随机<span>猎犬图片</span></h1>
            <p class="zjq_api">数据来源：<code>https://dog.ceo/api/breed/hound/images/random/3</code></p>
        </header>

        <div class="zjq_row" style="margin-top:10px">
            <button class="zjq_btn" id="zjq_reload_btn" type="button">换一批</button>
        </div>

        <div class="zjq_grid" id="zjq_grid"></div>
        <div class="zjq_status" id="zjq_status" hidden></div>

        <footer class="zjq_footer">
            张钧乔 · 《高级网页设计》课堂实践 · <a href="index.html">返回首页</a>
        </footer>
    </div>

    <script>
        // 姓名：张钧乔 日期：2026-11-02 功能名称：fetch获取Dog CEO随机猎犬图片并展示
        var zjq_api = 'https://dog.ceo/api/breed/hound/images/random/3';
        var zjq_grid = document.getElementById('zjq_grid');
        var zjq_status = document.getElementById('zjq_status');
        var zjq_btn = document.getElementById('zjq_reload_btn');

        function zjq_renderSkeleton() {
            zjq_grid.innerHTML = '';
            for (var zjq_i = 0; zjq_i < 3; zjq_i++) {
                var zjq_card = document.createElement('div');
                zjq_card.className = 'zjq_card';
                var zjq_skel = document.createElement('span');
                zjq_skel.className = 'zjq_skeleton';
                zjq_card.appendChild(zjq_skel);
                zjq_grid.appendChild(zjq_card);
            }
        }

        function zjq_renderImages(zjq_urls) {
            zjq_grid.innerHTML = '';
            for (var zjq_i = 0; zjq_i < zjq_urls.length; zjq_i++) {
                var zjq_url = zjq_urls[zjq_i];

                var zjq_card = document.createElement('div');
                zjq_card.className = 'zjq_card';

                var zjq_img = document.createElement('img');
                zjq_img.src = zjq_url;
                zjq_img.alt = '随机猎犬图片 ' + (zjq_i + 1);
                zjq_img.loading = 'lazy';

                var zjq_meta = document.createElement('div');
                zjq_meta.className = 'zjq_card-meta';
                var zjq_name = document.createElement('strong');
                zjq_name.textContent = 'Hound #' + (zjq_i + 1);
                var zjq_file = document.createElement('span');
                zjq_file.textContent = zjq_url.split('/').pop();
                zjq_meta.appendChild(zjq_name);
                zjq_meta.appendChild(zjq_file);

                zjq_card.appendChild(zjq_img);
                zjq_card.appendChild(zjq_meta);
                zjq_grid.appendChild(zjq_card);
            }
        }

        function zjq_showStatus(zjq_text, zjq_isError) {
            zjq_status.hidden = false;
            zjq_status.textContent = zjq_text;
            zjq_status.classList.toggle('zjq_status-err', !!zjq_isError);
        }

        function zjq_load() {
            zjq_btn.disabled = true;
            zjq_status.hidden = true;
            zjq_renderSkeleton();

            fetch(zjq_api)
                .then(function (zjq_res) {
                    if (!zjq_res.ok) {
                        throw new Error('HTTP ' + zjq_res.status);
                    }
                    return zjq_res.json();
                })
                .then(function (zjq_data) {
                    if (zjq_data.status !== 'success' || !Array.isArray(zjq_data.message)) {
                        throw new Error('接口返回数据异常');
                    }
                    zjq_renderImages(zjq_data.message);
                    zjq_status.hidden = true;
                })
                .catch(function (zjq_err) {
                    zjq_grid.innerHTML = '';
                    zjq_showStatus('加载失败：' + zjq_err.message + '，请检查网络后点击「换一批」重试。', true);
                })
                .finally(function () {
                    zjq_btn.disabled = false;
                });
        }

        zjq_btn.addEventListener('click', zjq_load);
        zjq_load();
    </script>
</body>
</html>
