<!DOCTYPE html>
<!-- 姓名：张钧乔，建立时间：2026-11-05 13:40:16，使用的大模型：GLM-5.3-Flash，功能名称：Canvas 粒子文字动画（张钧乔） -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 粒子文字动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0b1020;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow: hidden;
        }

        .zjq_stage {
            position: relative;
            width: min(900px, 94vw);
            height: min(520px, 60vh);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            background: radial-gradient(circle at 50% 30%, #1a2450 0%, #0b1020 70%);
        }

        .zjq_canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .zjq_tip {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }

        .zjq_toolbar {
            display: flex;
            gap: 12px;
        }

        .zjq_btn {
            padding: 9px 22px;
            border: 1px solid rgba(120, 160, 255, 0.45);
            border-radius: 999px;
            background: rgba(120, 160, 255, 0.1);
            color: #bcd0ff;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .zjq_btn:hover {
            background: rgba(120, 160, 255, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="zjq_stage">
        <canvas id="zjq_canvas" class="zjq_canvas"></canvas>
        <span class="zjq_tip">移动鼠标推开粒子 · 点击画面重新聚散</span>
    </div>
    <div class="zjq_toolbar">
        <button class="zjq_btn" id="zjq_scatter">散 开</button>
        <button class="zjq_btn" id="zjq_gather">聚 合</button>
    </div>

    <script>
        (function () {
            var canvas = document.getElementById('zjq_canvas');
            var ctx = canvas.getContext('2d');
            var stage = canvas.parentElement;

            /* 粒子参数 */
            var GAP = 4;            // 文字采样间隔，越小粒子越多
            var PARTICLE_R = 1.6;   // 粒子半径
            var TEXT = '张钧乔';
            var particles = [];
            var mouse = { x: -9999, y: -9999, r: 90 };
            var scattered = false;

            function resize() {
                var rect = stage.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                buildParticles();
            }

            /* 用离屏 canvas 画出文字，再按像素采样出目标点 */
            function sampleTargets() {
                var w = canvas.clientWidth;
                var h = canvas.clientHeight;
                var off = document.createElement('canvas');
                off.width = w;
                off.height = h;
                var octx = off.getContext('2d');

                var fontSize = Math.min(w / 3.2, h / 1.6);
                octx.fillStyle = '#fff';
                octx.textAlign = 'center';
                octx.textBaseline = 'middle';
                octx.font = 'bold ' + fontSize + 'px "Microsoft YaHei", sans-serif';
                octx.fillText(TEXT, w / 2, h / 2);

                var data = octx.getImageData(0, 0, w, h).data;
                var targets = [];
                for (var y = 0; y < h; y += GAP) {
                    for (var x = 0; x < w; x += GAP) {
                        if (data[(y * w + x) * 4 + 3] > 128) {
                            targets.push({ x: x, y: y });
                        }
                    }
                }
                return targets;
            }

            function buildParticles() {
                var targets = sampleTargets();
                particles = [];
                var w = canvas.clientWidth;
                var h = canvas.clientHeight;
                var palette = ['#7aa2ff', '#9d7aff', '#5eead4', '#ffd166', '#ff7eb6'];
                for (var i = 0; i < targets.length; i++) {
                    var t = targets[i];
                    particles.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        tx: t.x,
                        ty: t.y,
                        vx: 0,
                        vy: 0,
                        color: palette[i % palette.length]
                    });
                }
            }

            function step() {
                var w = canvas.clientWidth;
                var h = canvas.clientHeight;
                ctx.clearRect(0, 0, w, h);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];

                    if (scattered) {
                        /* 散开状态：持续漂移 */
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < -20) p.x = w + 20;
                        if (p.x > w + 20) p.x = -20;
                        if (p.y < -20) p.y = h + 20;
                        if (p.y > h + 20) p.y = -20;
                    } else {
                        /* 聚合状态：向目标点弹回 */
                        var dx = p.tx - p.x;
                        var dy = p.ty - p.y;
                        p.vx += dx * 0.02;
                        p.vy += dy * 0.02;
                        p.vx *= 0.86;
                        p.vy *= 0.86;
                        p.x += p.vx;
                        p.y += p.vy;
                    }

                    /* 鼠标斥力 */
                    var mx = p.x - mouse.x;
                    var my = p.y - mouse.y;
                    var dist = Math.sqrt(mx * mx + my * my);
                    if (dist < mouse.r && dist > 0.01) {
                        var force = (mouse.r - dist) / mouse.r;
                        p.x += (mx / dist) * force * 6;
                        p.y += (my / dist) * force * 6;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, PARTICLE_R, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }

                requestAnimationFrame(step);
            }

            function toggleScatter() {
                scattered = !scattered;
                if (scattered) {
                    for (var i = 0; i < particles.length; i++) {
                        var a = Math.random() * Math.PI * 2;
                        var speed = 1 + Math.random() * 3;
                        particles[i].vx = Math.cos(a) * speed;
                        particles[i].vy = Math.sin(a) * speed;
                    }
                }
            }

            canvas.addEventListener('mousemove', function (e) {
                var rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });
            canvas.addEventListener('mouseleave', function () {
                mouse.x = -9999;
                mouse.y = -9999;
            });
            canvas.addEventListener('click', toggleScatter);
            document.getElementById('zjq_scatter').addEventListener('click', function () {
                if (!scattered) toggleScatter();
            });
            document.getElementById('zjq_gather').addEventListener('click', function () {
                if (scattered) toggleScatter();
            });
            window.addEventListener('resize', resize);

            resize();
            requestAnimationFrame(step);
        })();
    </script>
</body>
</html>
