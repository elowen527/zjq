<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>213 张钧乔</title>
    <style>
        p{
            color: #3aa0db;
            font-size: 20px;
        }
        h2{
            background-color: #000;
            color: #fff;
        }
        .zhang_selector{
            color: #fff;
        }
        /* 标签选择器 */
        #zhang_box{
            width:300px;
            height: 300px;
            background-color: #39c2e1d5;
        }
        .zhang_new-box{
            width: 300px;
            height: 300px;
            background-color: #f4a261;
        }
        .zhang_n1{
            color: #c300ff;
        }
        .zhang_n2{
            color: #ffa600;
        }
        .zhang_n3{
            color: #eeff00;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="zhang_box">
        <p>css<span class="zhang_selector">选择器</span></p>
        <p><span class="zhang_n1">张</span><span class="zhang_n2">钧</span><span class="zhang_n3">乔</span></p>
        <p>CSS属性</p>
    </div>
    <div class="zhang_new-box"></div>
    <!-- 扩展1：名字的每个字不同颜色，在同一行 -->
     <!-- 扩展2：h2黑底白字 -->
      <!-- 扩展3：选择器三个字是白色 -->
</body>
</html>
