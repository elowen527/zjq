<!DOCTYPE html>
<!-- 姓名：张钧乔，建立时间：2026-10-29 14:40:00，使用的大模型：GLM-5.3，功能名称：新车上市表格——最新上市/即将上市Tab切换与点击高亮动画 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="新车上市信息表格实践：最新上市与即将上市两个 Tab 的点击切换，点击表格行触发高亮动画">
    <title>新车上市 | 张钧乔</title>
    <style>
        :root {
            --zjq-blue: #4c88c5;
            --zjq-blue-deep: #2f6ea8;
            --zjq-blue-light: #dce9f7;
            --zjq-ink: #333333;
            --zjq-muted: #777777;
            --zjq-line: #cfcfcf;
            --zjq-head: #f2f2f2;
            --zjq-stripe: #fafcff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            color: var(--zjq-ink);
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 13px;
            line-height: 1.6;
        }

        .zjq_box {
            width: 320px;
            margin: 0 auto;
        }

        /* ===== Tab 栏 ===== */
        .zjq_tabs {
            display: flex;
        }

        .zjq_tab {
            flex: 1;
            padding: 7px 0;
            border: 1px solid var(--zjq-line);
            border-bottom: none;
            background: #ffffff;
            color: var(--zjq-muted);
            font-size: 13.5px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: background 200ms ease, color 200ms ease;
        }

        .zjq_tab + .zjq_tab {
            border-left: none;
        }

        .zjq_tab:hover {
            color: var(--zjq-blue);
        }

        .zjq_tab.zjq_tab-on {
            position: relative;
            background: var(--zjq-blue-light);
            color: var(--zjq-blue-deep);
        }

        /* 激活 Tab 底部的白色压边，使其与表格连成一体 */
        .zjq_tab.zjq_tab-on::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 1px;
            background: var(--zjq-blue-light);
        }

        /* ===== 表格 ===== */
        .zjq_table {
            width: 100%;
            border: 1px solid var(--zjq-line);
            border-collapse: collapse;
            background: #ffffff;
        }

        .zjq_table th,
        .zjq_table td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--zjq-line);
            text-align: left;
            white-space: nowrap;
        }

        .zjq_table thead th {
            background: var(--zjq-head);
            color: var(--zjq-ink);
            font-weight: 700;
            border-bottom: 1px solid var(--zjq-line);
        }

        .zjq_table tbody tr:nth-child(even) {
            background: var(--zjq-stripe);
        }

        .zjq_col-time {
            width: 76px;
        }

        .zjq_col-price {
            width: 96px;
            text-align: left;
        }

        /* ===== 行点击高亮动画 ===== */
        .zjq_table tbody tr {
            cursor: pointer;
            transition: background 300ms ease;
        }

        .zjq_table tbody tr:hover {
            background: #eef5fc;
        }

        @keyframes zjq_flash {
            0% {
                background: #fff3c2;
                box-shadow: inset 3px 0 0 var(--zjq-blue);
            }
            55% {
                background: #e8f2fd;
                box-shadow: inset 3px 0 0 var(--zjq-blue);
            }
            100% {
                background: transparent;
                box-shadow: inset 3px 0 0 transparent;
            }
        }

        .zjq_table tbody tr.zjq_hit {
            animation: zjq_flash 1.1s ease forwards;
        }

        /* 点击瞬间文字的弹跳强调 */
        @keyframes zjq_bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.05); color: var(--zjq-blue-deep); }
            100% { transform: scale(1); }
        }

        .zjq_table tbody tr.zjq_hit td {
            animation: zjq_bump 500ms ease;
        }
    </style>
</head>
<body>
    <div class="zjq_box">
        <!-- Tab 栏 -->
        <div class="zjq_tabs" id="zjq_tabs">
            <span class="zjq_tab zjq_tab-on" data-tab="new">最新上市</span>
            <span class="zjq_tab" data-tab="soon">即将上市</span>
        </div>

        <!-- 数据表格 -->
        <table class="zjq_table">
            <thead>
                <tr>
                    <th class="zjq_col-time">上市时间</th>
                    <th>品牌/车型</th>
                    <th class="zjq_col-price">售价（万元）</th>
                </tr>
            </thead>
            <tbody id="zjq_tbody"></tbody>
        </table>
    </div>

    <script>
        // 姓名：张钧乔 日期：2026-10-29 功能名称：新车上市表格——Tab切换与行点击高亮动画
        var zjq_carData = {
            new: [
                { time: '12月13日', name: '沃尔沃S60L', price: '26.98-38.49' },
                { time: '12月12日', name: 'Jeep牧马人龙腾典藏', price: '47.99-59.99' },
                { time: '12月10日', name: '一汽大众高尔夫7', price: '11.89-18.29' },
                { time: '12月6日', name: '2014款古思特', price: '419.0-666.0' },
                { time: '12月5日', name: '起亚新K5', price: '15.98-25.18' },
                { time: '12月5日', name: '2014款奥德赛', price: '22.98-29.68' }
            ],
            soon: [
                { time: '12月20日', name: '奥迪A3 Limousine', price: '20.59-31.99' },
                { time: '12月21日', name: '宝马2系运动旅行车', price: '27.99-34.99' },
                { time: '12月25日', name: '长安CS75四驱版', price: '14.08-16.28' },
                { time: '12月28日', name: '东风标致新408', price: '12.69-17.19' },
                { time: '1月8日', name: '广汽本田缤智1.8L', price: '13.88-18.98' },
                { time: '1月15日', name: '北京现代 ix25 2.0L', price: '13.98-18.68' }
            ]
        };

        var zjq_tbody = document.getElementById('zjq_tbody');

        /* ===== 渲染表格 ===== */
        function zjq_renderRows(zjq_key) {
            var zjq_rows = zjq_carData[zjq_key];
            var zjq_html = '';
            for (var zjq_i = 0; zjq_i < zjq_rows.length; zjq_i++) {
                var zjq_r = zjq_rows[zjq_i];
                zjq_html += '<tr data-idx="' + zjq_i + '">';
                zjq_html += '<td class="zjq_col-time">' + zjq_r.time + '</td>';
                zjq_html += '<td>' + zjq_r.name + '</td>';
                zjq_html += '<td class="zjq_col-price">' + zjq_r.price + '</td>';
                zjq_html += '</tr>';
            }
            zjq_tbody.innerHTML = zjq_html;
        }

        /* ===== Tab 切换 ===== */
        var zjq_currentKey = 'new';

        document.getElementById('zjq_tabs').addEventListener('click', function (zjq_event) {
            var zjq_tab = zjq_event.target.closest('.zjq_tab');
            if (!zjq_tab) { return; }

            var zjq_key = zjq_tab.getAttribute('data-tab');
            if (zjq_key === zjq_currentKey) { return; }
            zjq_currentKey = zjq_key;

            var zjq_all = document.querySelectorAll('.zjq_tab');
            for (var zjq_i = 0; zjq_i < zjq_all.length; zjq_i++) {
                zjq_all[zjq_i].classList.toggle('zjq_tab-on', zjq_all[zjq_i] === zjq_tab);
            }
            zjq_renderRows(zjq_key);
        });

        /* ===== 行点击高亮动画 ===== */
        zjq_tbody.addEventListener('click', function (zjq_event) {
            var zjq_row = zjq_event.target.closest('tr');
            if (!zjq_row) { return; }

            // 重新触发动画：先移除再强制回流后添加
            zjq_row.classList.remove('zjq_hit');
            void zjq_row.offsetWidth;
            zjq_row.classList.add('zjq_hit');
        });

        /* 初始渲染 */
        zjq_renderRows(zjq_currentKey);
    </script>
</body>
</html>
