<!DOCTYPE html>
<!-- 姓名：张钧乔，建立时间：2026-10-29 14:40:00，使用的大模型：GLM-5.3，功能名称：新车上市表格——最新上市/即将上市Tab切换与点击高亮动画 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="新车上市表格实践：最新上市与即将上市两个 Tab 切换展示不同数据，点击任意文字触发行高亮闪烁动画">
    <title>新车上市 | 张钧乔</title>
    <style>
        :root {
            --zjq-ink: #333333;
            --zjq-dark: #1a1a1a;
            --zjq-muted: #999999;
            --zjq-line: #e5e5e5;
            --zjq-tab-bg: #f4f4f4;
            --zjq-hit: #fdf0d5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 0;
            color: var(--zjq-ink);
            background:
                radial-gradient(circle at 88% 4%, rgba(233, 105, 63, 0.08), transparent 22rem),
                linear-gradient(135deg, #f4f0e8 0%, #edf3ee 55%, #fffaf2 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 13px;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .zjq_back {
            position: fixed;
            top: 16px;
            left: 20px;
            color: #9a958a;
            font-size: 13px;
        }

        .zjq_back:hover {
            color: #b8472d;
        }

        .zjq_box {
            width: 320px;
            margin: 0 auto;
            border: 1px solid #dcdcdc;
            border-radius: 3px;
            background: #ffffff;
            box-shadow: 0 8px 22px rgba(31, 48, 36, 0.08);
            overflow: hidden;
        }

        /* ===== Tab 栏 ===== */
        .zjq_tabs {
            display: flex;
            border-bottom: 1px solid var(--zjq-line);
        }

        .zjq_tab {
            flex: 1;
            padding: 9px 0;
            border: none;
            background: var(--zjq-tab-bg);
            color: var(--zjq-muted);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 180ms ease, color 180ms ease;
        }

        .zjq_tab + .zjq_tab {
            border-left: 1px solid var(--zjq-line);
        }

        .zjq_tab.zjq_tab-on {
            background: #ffffff;
            color: var(--zjq-dark);
            font-weight: 700;
        }

        .zjq_tab:not(.zjq_tab-on):hover {
            color: #666666;
            background: #ececec;
        }

        /* ===== 表格 ===== */
        .zjq_table {
            width: 100%;
            border-collapse: collapse;
        }

        .zjq_table th {
            padding: 8px 10px;
            border-bottom: 1px solid var(--zjq-line);
            background: #fafafa;
            color: #808080;
            font-size: 12.5px;
            font-weight: 400;
            text-align: left;
        }

        .zjq_table th:nth-child(3) {
            text-align: right;
        }

        .zjq_table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 150ms ease;
        }

        .zjq_table tr:last-child td {
            border-bottom: none;
        }

        .zjq_col-time {
            color: var(--zjq-muted);
            width: 26%;
            white-space: nowrap;
        }

        .zjq_col-name {
            color: var(--zjq-dark);
        }

        .zjq_col-price {
            color: var(--zjq-muted);
            text-align: right;
            white-space: nowrap;
        }

        /* ===== 点击行的高亮动画 ===== */
        .zjq_table td.zjq_cell-hit {
            animation: zjq_flash 900ms ease-out;
        }

        @keyframes zjq_flash {
            0% {
                background: #ffe9a8;
                box-shadow: inset 0 0 0 2px #f5b90f;
            }
            60% {
                background: var(--zjq-hit);
                box-shadow: inset 0 0 0 1px #f0cf7a;
            }
            100% {
                background: transparent;
                box-shadow: inset 0 0 0 0 transparent;
            }
        }

        /* Tab 切换时表格内容的淡入 */
        .zjq_body-wrap.zjq_body-fade {
            animation: zjq_fadein 320ms ease;
        }

        @keyframes zjq_fadein {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .zjq_note {
            width: 320px;
            margin: 14px auto 0;
            color: #9a958a;
            font-size: 12.5px;
        }
    </style>
</head>
<body>
    <a class="zjq_back" href="index.html">← 返回作品集首页</a>

    <div class="zjq_box">
        <!-- Tab 栏 -->
        <div class="zjq_tabs">
            <button class="zjq_tab zjq_tab-on" type="button" data-tab="new">最新上市</button>
            <button class="zjq_tab" type="button" data-tab="soon">即将上市</button>
        </div>

        <!-- 表格 -->
        <div class="zjq_body-wrap" id="zjq_body_wrap">
            <table class="zjq_table">
                <thead>
                    <tr>
                        <th>上市时间</th>
                        <th>品牌/车型</th>
                        <th>售价（万元）</th>
                    </tr>
                </thead>
                <tbody id="zjq_tbody"></tbody>
            </table>
        </div>
    </div>

    <p class="zjq_note">点击「最新上市 / 即将上市」切换数据，点击表格中任意一行文字可触发高亮动画。</p>

    <script>
        // 姓名：张钧乔 日期：2026-10-29 功能名称：新车上市表格——Tab切换与点击高亮动画
        var zjq_data = {
            new: [
                { time: '12月13日', name: '沃尔沃S60L', price: '26.98-38.49' },
                { time: '12月12日', name: 'Jeep牧马人龙腾典藏', price: '47.99-59.99' },
                { time: '12月10日', name: '一汽大众高尔夫7', price: '11.89-18.29' },
                { time: '12月6日', name: '2014款古思特', price: '419.0-666.0' },
                { time: '12月5日', name: '起亚新K5', price: '15.98-25.18' },
                { time: '12月5日', name: '2014款奥德赛', price: '22.98-28.68' }
            ],
            soon: [
                { time: '12月20日', name: '广汽丰田全新汉兰达', price: '24.88-42.28' },
                { time: '12月26日', name: '奥迪新款A6L', price: '41.53-74.26' },
                { time: '12月28日', name: '别克全新英朗', price: '10.99-15.99' },
                { time: '1月6日', name: '大众新帕萨特', price: '18.38-32.28' },
                { time: '1月15日', name: '一汽丰田新卡罗拉', price: '10.78-15.98' },
                { time: '1月20日', name: '广汽本田缤智', price: '12.88-18.98' }
            ]
        };

        var zjq_current = 'new';

        /* ===== 渲染表格 ===== */
        function zjq_render() {
            var zjq_rows = zjq_data[zjq_current];
            var zjq_html = '';
            for (var zjq_i = 0; zjq_i < zjq_rows.length; zjq_i++) {
                var zjq_r = zjq_rows[zjq_i];
                zjq_html += '<tr><td class="zjq_col-time">' + zjq_r.time + '</td>' +
                    '<td class="zjq_col-name">' + zjq_r.name + '</td>' +
                    '<td class="zjq_col-price">' + zjq_r.price + '</td></tr>';
            }
            document.getElementById('zjq_tbody').innerHTML = zjq_html;
        }

        /* ===== Tab 切换 ===== */
        document.querySelectorAll('.zjq_tab').forEach(function (zjq_tab) {
            zjq_tab.addEventListener('click', function () {
                var zjq_key = zjq_tab.getAttribute('data-tab');
                if (zjq_key === zjq_current) { return; }

                document.querySelectorAll('.zjq_tab').forEach(function (zjq_t) {
                    zjq_t.classList.remove('zjq_tab-on');
                });
                zjq_tab.classList.add('zjq_tab-on');
                zjq_current = zjq_key;

                var zjq_wrap = document.getElementById('zjq_body_wrap');
                zjq_wrap.classList.remove('zjq_body-fade');
                void zjq_wrap.offsetWidth; // 重置动画
                zjq_wrap.classList.add('zjq_body-fade');

                zjq_render();
            });
        });

        /* ===== 点击任意文字：高亮闪烁动画 ===== */
        document.getElementById('zjq_tbody').addEventListener('click', function (zjq_event) {
            var zjq_cell = zjq_event.target.closest('td');
            if (!zjq_cell) { return; }

            // 先移除再添加，保证连续点击同一格也能重新播放动画
            zjq_cell.classList.remove('zjq_cell-hit');
            void zjq_cell.offsetWidth;
            zjq_cell.classList.add('zjq_cell-hit');
        });

        zjq_render();
    </script>
</body>
</html>
