<!DOCTYPE html>
<!-- 姓名：张钧乔，建立时间：2026-11-05 14:07:20，使用的大模型：GLM-5.3-Flash，功能名称：ECharts 双图演示（渐变堆叠面积图 + 北京 AQI 数据图） -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts 双图演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 28px 16px;
            background: #f2f4f8;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .zjq_head {
            text-align: center;
        }

        .zjq_head h1 {
            font-size: 22px;
            color: #1f2d3d;
            letter-spacing: 2px;
        }

        .zjq_head p {
            margin-top: 6px;
            font-size: 12px;
            color: #7a8699;
            letter-spacing: 1px;
        }

        .zjq_chart-card {
            width: min(1020px, 96vw);
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 14px 6px;
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.08);
        }

        .zjq_chart-tag {
            display: inline-block;
            padding: 3px 12px;
            margin: 4px 0 2px 6px;
            border-radius: 999px;
            background: #eef3ff;
            color: #3a6df0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .zjq_chart {
            width: 100%;
            height: 440px;
        }

        .zjq_status {
            font-size: 12px;
            color: #98a2b3;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="zjq_head">
        <h1>ECharts 可视化双图演示</h1>
        <p>echarts.min.js 已本地化至 cdn 目录 · AQI 数据来自 data/aqi-beijing.js 本地文件</p>
    </div>

    <div class="zjq_chart-card">
        <span class="zjq_chart-tag">图一 · 渐变堆叠面积图</span>
        <div id="zjq_area_chart" class="zjq_chart"></div>
    </div>

    <div class="zjq_chart-card">
        <span class="zjq_chart-tag">图二 · Beijing AQI</span>
        <div id="zjq_aqi_chart" class="zjq_chart"></div>
        <p class="zjq_status" id="zjq_aqi_status">数据加载中…</p>
    </div>

    <script src="cdn/echarts.min.js"></script>
    <script src="data/aqi-beijing.js"></script>
    <script>
        (function () {
            /* ---------- 图一：Gradient Stacked Area ---------- */
            var zjq_areaChart = echarts.init(document.getElementById('zjq_area_chart'));
            var zjq_areaOption = {
                color: ['#80FFA5', '#00DDFF', '#37A2FF', '#FF0087', '#FFBF00'],
                title: {
                    text: 'Gradient Stacked Area Chart'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        label: {
                            backgroundColor: '#6a7985'
                        }
                    }
                },
                legend: {
                    data: ['Line 1', 'Line 2', 'Line 3', 'Line 4', 'Line 5']
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
                    }
                ],
                yAxis: [
                    {
                        type: 'value'
                    }
                ],
                series: [
                    {
                        name: 'Line 1',
                        type: 'line',
                        stack: 'Total',
                        smooth: true,
                        lineStyle: { width: 0 },
                        showSymbol: false,
                        areaStyle: {
                            opacity: 0.8,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgb(128, 255, 165)' },
                                { offset: 1, color: 'rgb(1, 191, 236)' }
                            ])
                        },
                        emphasis: { focus: 'series' },
                        data: [140, 232, 101, 264, 90, 340, 250]
                    },
                    {
                        name: 'Line 2',
                        type: 'line',
                        stack: 'Total',
                        smooth: true,
                        lineStyle: { width: 0 },
                        showSymbol: false,
                        areaStyle: {
                            opacity: 0.8,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgb(0, 221, 255)' },
                                { offset: 1, color: 'rgb(77, 119, 255)' }
                            ])
                        },
                        emphasis: { focus: 'series' },
                        data: [120, 282, 111, 234, 220, 340, 310]
                    },
                    {
                        name: 'Line 3',
                        type: 'line',
                        stack: 'Total',
                        smooth: true,
                        lineStyle: { width: 0 },
                        showSymbol: false,
                        areaStyle: {
                            opacity: 0.8,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgb(55, 162, 255)' },
                                { offset: 1, color: 'rgb(116, 21, 219)' }
                            ])
                        },
                        emphasis: { focus: 'series' },
                        data: [320, 132, 201, 334, 190, 130, 220]
                    },
                    {
                        name: 'Line 4',
                        type: 'line',
                        stack: 'Total',
                        smooth: true,
                        lineStyle: { width: 0 },
                        showSymbol: false,
                        areaStyle: {
                            opacity: 0.8,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgb(255, 0, 135)' },
                                { offset: 1, color: 'rgb(135, 0, 157)' }
                            ])
                        },
                        emphasis: { focus: 'series' },
                        data: [220, 402, 231, 134, 190, 230, 120]
                    },
                    {
                        name: 'Line 5',
                        type: 'line',
                        stack: 'Total',
                        smooth: true,
                        lineStyle: { width: 0 },
                        showSymbol: false,
                        label: {
                            show: true,
                            position: 'top'
                        },
                        areaStyle: {
                            opacity: 0.8,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgb(255, 191, 0)' },
                                { offset: 1, color: 'rgb(224, 62, 76)' }
                            ])
                        },
                        emphasis: { focus: 'series' },
                        data: [220, 302, 181, 234, 210, 290, 150]
                    }
                ]
            };
            zjq_areaChart.setOption(zjq_areaOption);

            /* ---------- 图二：Beijing AQI（本地 JS 数据，file:// 与 http:// 均可加载） ---------- */
            var zjq_aqiChart = echarts.init(document.getElementById('zjq_aqi_chart'));
            var zjq_aqiStatus = document.getElementById('zjq_aqi_status');

            try {
                var zjq_data = window.zjq_aqiData;
                if (!zjq_data || !zjq_data.length) {
                    throw new Error('未找到 window.zjq_aqiData，请检查 data/aqi-beijing.js 是否加载');
                }
                zjq_aqiChart.setOption({
                        title: {
                            text: 'Beijing AQI',
                            left: '1%'
                        },
                        tooltip: {
                            trigger: 'axis'
                        },
                        grid: {
                            left: '5%',
                            right: '15%',
                            bottom: '10%'
                        },
                        xAxis: {
                            data: zjq_data.map(function (zjq_item) {
                                return zjq_item[0];
                            })
                        },
                        yAxis: {},
                        toolbox: {
                            right: 10,
                            feature: {
                                dataZoom: {
                                    yAxisIndex: 'none'
                                },
                                restore: {},
                                saveAsImage: {}
                            }
                        },
                        dataZoom: [
                            {
                                startValue: '2014-06-01'
                            },
                            {
                                type: 'inside'
                            }
                        ],
                        visualMap: {
                            top: 50,
                            right: 10,
                            pieces: [
                                { gt: 0, lte: 50, color: '#93CE07' },
                                { gt: 50, lte: 100, color: '#FBDB0F' },
                                { gt: 100, lte: 150, color: '#FC7D02' },
                                { gt: 150, lte: 200, color: '#FD0100' },
                                { gt: 200, lte: 300, color: '#AA069F' },
                                { gt: 300, color: '#AC3B2A' }
                            ],
                            outOfRange: {
                                color: '#999'
                            }
                        },
                        series: {
                            name: 'Beijing AQI',
                            type: 'line',
                            data: zjq_data.map(function (zjq_item) {
                                return zjq_item[1];
                            }),
                            markLine: {
                                silent: true,
                                lineStyle: {
                                    color: '#333'
                                },
                                data: [
                                    { yAxis: 50 },
                                    { yAxis: 100 },
                                    { yAxis: 150 },
                                    { yAxis: 200 },
                                    { yAxis: 300 }
                                ]
                            }
                        }
                    });
                    zjq_aqiStatus.textContent = '共加载 ' + zjq_data.length + ' 条 AQI 记录（本地 data/aqi-beijing.js）';
            } catch (zjq_err) {
                zjq_aqiStatus.textContent = '数据加载失败：' + zjq_err.message;
            }

            /* ---------- 响应窗口尺寸变化 ---------- */
            window.addEventListener('resize', function () {
                zjq_areaChart.resize();
                zjq_aqiChart.resize();
            });
        })();
    </script>
</body>
</html>
