<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f7f7f7, #e8e8e8);
        font-family: "Microsoft YaHei", sans-serif;
    }

    .zhang_main {
        width: 980px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .zhang_box {
        position: relative;
        width: 150px;
        height: 159px;
        border: 2px solid #222;
        border-radius: 16px;
        margin: 0;
        background: linear-gradient(145deg, #ddd, #bdbdbd);
        font-size: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.45s ease;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        cursor: pointer;
    }

    .zhang_box:hover {
        transform: translateY(-6px);
    }

    .zhang_box:first-child:hover {
        background-color: #000;
        color: #fff;
        font-size: 60px;
        border-width: 30px;
        transform: rotate(-3deg) scale(1.05);
    }

    .zhang_box:nth-child(3):hover,
    .zhang_box:nth-child(4):hover,
    .zhang_box:nth-child(5):hover,
    .zhang_box:nth-child(6):hover,
    .zhang_box:nth-child(6)+.zhang_box:hover,
    .zhang_box:nth-child(8):hover {
        box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.35);
        transform: translateY(-6px) scale(1.02);
    }

    .zhang_box:last-child::after {
        content: "张钧乔";
        color: #fff;
        background-color: #000;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        width: 84px;
        height: 38px;
        margin-left: 12px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
    }

    .zhang_box:nth-of-type(3n):hover {
        border: 3px solid #000;
        background: linear-gradient(135deg, #e9e9e9, #cfcfcf);
    }

    .zhang_box:nth-child(even):hover {
        background: linear-gradient(135deg, #ff9966, #ff5e62);
        color: #fff;
        border-radius: 12px;
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }
</style>
</head>
<body>
    <div class="zhang_main">
        <div class="zhang_box">1</div>
        <div class="zhang_box">2</div>
        <div class="zhang_box">3</div>
        <div class="zhang_box">4</div>
        <div class="zhang_box">5</div>
        <div class="zhang_box">6</div>
        <div class="zhang_box">7</div>
        <div class="zhang_box">8</div>
        <div class="zhang_box">9</div>
        <div class="zhang_box">10</div>
        <div class="zhang_box">11</div>
        <div class="zhang_box">12</div>
    </div>
</body>
</html>
