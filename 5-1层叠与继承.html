<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css"></link>
    <style>
        p{
            color: blue;
            font-size: 100px;
        }
        .zhang_text{
            color: red;
        }
        #text{
            color: green;
        }
        .zhang_box p{
            color: yellow;
        }
        #zhang_box #text{
            color: pink;
        }
        .zhang_text{
            color: purple!important;
            /* 优先级：id><class>标签*/
        }
        #zhang_box{
            width: 400px;
            height: 400px;
            background-color: gray;
            margin: 10px;
            letter-spacing: 5px;
            /* 圆角矩形50% */
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h2>层次与继承</h2>
    <div id="zhang_box" class="zhang_box">
        <p>213张钧乔</p>
        <p>层叠与继承的优先级</p>
    </div>
</body>
</html>
