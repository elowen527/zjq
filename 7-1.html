<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
             padding: 0%;
           margin: 0%;
        }
        ul{
           list-style: none;
        }
        img{}
            .zhang_ilist {
                display: flex;
            }
            .zhang_ilist li{
            width: 33%;
            margin-right: 1px;
            flex-grow: 1;
            position: relative;
            }
            .zhang_ilist img{
               width: 100%;
               display: block;
            }
            .zhang_ilist p{
          /* 居中 */
          text-align: center;
          /* 字体大小 */
          font-size: 12px;
          /* 行高 */
          line-height: 20px;
          /*绝对定位*/
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          background: rgba(0, 0, 0, 0.45);
          color: #fff;
          padding: 8px 0;
            }
                </style>

</head>
<body>
    <ul class="zhang_ilist">
        <li><img src="./img/4.jpg" >
        <p>张钧乔的上图下文</p>
        </li>
        <li><img src="./img/7.jpg" >
        <p>张钧乔的下图下文</p>
        </li>
        <li><img src="./img/6.jpg" >
        <p>张钧乔的下图下文</p>
        </li>
    </ul>

    
</body>
</html>
